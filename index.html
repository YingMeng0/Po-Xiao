<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        /* 核心暗黑风样式 */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at center, #2a2a2a 0%, #121212 100%);
        }
        .container {
            text-align: center;
            max-width: 800px;
            padding: 40px;
            border: 1px solid #333;
            background-color: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.1);
        }
        h1 {
            font-size: 64px;
            letter-spacing: 8px;
            margin-bottom: 10px;
            color: #fff;
        }
        .subtitle {
            font-size: 24px;
            letter-spacing: 4px;
            color: #ff6600; /* 余晖橙色 */
            margin-bottom: 30px;
        }
        p {
            color: #aaa;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 40px;
        }
        .ip-box {
            font-size: 24px;
            background: #1a1a1a;
            border: 1px dashed #ff6600;
            padding: 15px;
            display: inline-block;
            margin-bottom: 30px;
            cursor: pointer;
        }
        .btn {
            display: inline-block;
            background-color: #ff6600;
            color: #fff;
            text-decoration: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        .btn:hover {
            background-color: #ff8c33;
            box-shadow: 0 0 15px #ff6600;
        }
    </style>
</head>
<body>

    <div class="container">
